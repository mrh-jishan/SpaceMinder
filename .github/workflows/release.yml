name: Build and release SpaceMinder

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Secrets may be used in env, but not directly in an `if:` expression.
      HAS_SIGNING_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && 'true' || 'false' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          echo "CODE_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Build universal native app
        run: zsh scripts/build-universal-app.sh

      - name: Notarize release app
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERTIFICATE == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: zsh scripts/notarize-app.sh

      - name: Create DMG and checksum
        run: zsh scripts/create-dmg.sh

      - name: Verify app bundle
        run: |
          plutil -lint dist/SpaceMinder.app/Contents/Info.plist
          xcrun lipo -info dist/SpaceMinder.app/Contents/MacOS/SpaceMinder | grep -E 'arm64.*x86_64|x86_64.*arm64'
          codesign --verify --deep --strict --verbose=2 dist/SpaceMinder.app
          test -s dist/*.dmg
          test -s dist/*.dmg.sha256

      - name: Upload installable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMinder-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$HAS_SIGNING_CERTIFICATE" == "true" && "$HAS_NOTARY_CREDENTIALS" == "true" ]]; then
            cat > "$notes" <<'EOF'
          This universal DMG is Developer ID signed and Apple notarized for Intel and Apple Silicon Macs.
          EOF
          else
            cat > "$notes" <<'EOF'
          ## Direct install (no Apple Developer subscription required)

          This universal DMG is an ad-hoc-signed build for Intel and Apple Silicon Macs. Download the `.dmg`, open it, and drag **SpaceMinder** to Applications.

          Because it is not Apple-notarized, macOS will show an “unidentified developer” warning on first launch. In Finder, **Control-click SpaceMinder.app → Open → Open**. This is expected for any app distributed outside the Mac App Store without a Developer ID certificate.

          Verify the download before opening it:

          ```zsh
          shasum -a 256 SpaceMinder-*.dmg
          ```

          The matching expected checksum is included as a `.sha256` release asset.
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 \
            --title "SpaceMinder ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
